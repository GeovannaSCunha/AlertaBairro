name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  seguranca:
    name: Segurança (Gitleaks, Semgrep, Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (segredos no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (análise estática)
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --metrics=off
      - name: Trivy (dependências e configuração)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  imagens:
    name: Imagens Docker (build + Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alertabairro-api:ci backend
      - run: docker build -t alertabairro-web:ci frontend
      - name: Trivy na imagem da API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alertabairro-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy na imagem web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alertabairro-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
