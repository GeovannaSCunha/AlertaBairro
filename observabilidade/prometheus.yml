# Coleta as métricas da API. Para monitorar o MVP publicado, troque o alvo pela URL pública da API
# (ex.: targets: ["alertabairro-api.onrender.com"] e scheme: https).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: alertabairro-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
