groups:
  - name: alertabairro
    rules:
      - alert: TaxaDeErros5xxAlta
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severidade: critica }
        annotations:
          resumo: "Mais de 5% das requisições da API estão falhando (5xx)"
      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severidade: aviso }
        annotations:
          resumo: "p95 de latência da API acima de 2 s"
      - alert: DatabricksIndisponivel
        expr: sum(increase(alertabairro_consultas_dados_total{origem="databricks",status="erro"}[10m])) > 3
        for: 0m
        labels: { severidade: aviso }
        annotations:
          resumo: "Consultas ao Databricks falhando; a API está servindo o snapshot"
      - alert: ApiForaDoAr
        expr: up{job="alertabairro-api"} == 0
        for: 2m
        labels: { severidade: critica }
        annotations:
          resumo: "Prometheus não consegue coletar métricas da API"
